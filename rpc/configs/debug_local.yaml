experiment:
  name: debug_local
  method: leaselora
  seed: 42
  num_rounds: 3
  eval_every: 1
  log_dir: logs/testbed/debug_local
  checkpoint_dir: checkpoints/testbed/debug_local

runtime:
  backend: http
  coordinator_host: "0.0.0.0"
  coordinator_port: 29580
  round_timeout_sec: 120
  discard_late_updates: true
  real_network_transfer: true
  serialize_updates: true
  min_workers: 1
  worker_wait_timeout_sec: 60

model:
  dataset: sst2
  task_type: text_classification
  backbone: distilbert-base-uncased
  num_labels: 2
  precision: bf16
  lora:
    rank: 8
    alpha: 16
    dropout: 0.05
    target_modules: ["q_lin", "v_lin"]
    bias: "none"

fl:
  num_clients: 4
  clients_per_round: 2
  partition:
    type: dirichlet
    alpha: 0.5
    seed: 42
    dir: partitions/sst2_alpha0.5_clients4
  local:
    local_steps: 5
    batch_size: 8
    optimizer: adamw
    lr: 3.0e-4
    weight_decay: 0.01
    max_grad_norm: 1.0
    server_lr: 1.0

scheduler:
  lease_granularity: layer_bundle
  bundle_size: 1
  warmup_full_rounds: 1
  deadline_factor: 2.0
  enable_coverage_feedback: true
  enable_service_feedback: true
  enable_variance_feedback: false
  enable_weak_client_reservation: false
  shrink_policy: ["slices", "local_steps", "micro_batch"]

resources:
  profile: uniform
  tiers:
    - budget: 1.0
      compute_slowdown: 1.0
      uplink_mbps: 100
      throughput: 500
      memory_budget_gb: 24

logging:
  write_jsonl: true
  write_csv_summary: false
  log_client_updates: true
  log_lease_details: true
  log_payload_bytes: true
  log_gpu_memory: true
  log_network_time: true
